# Cloudflare Workers (free tier) deployment. See docs/HOSTING.md.
name = "xoba-big-idea"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "xoba-big-idea"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "xoba-big-idea-audio"

[ai]
binding = "AI"

[vars]
AI_PROVIDER = "workers-ai"
TRANSCRIBE_PROVIDER = "workers-ai"
AI_MONTHLY_CAP_USD = "2"
# Secrets (set with `npx wrangler secret put NAME`): APP_TOKEN, ANTHROPIC_API_KEY, OPENAI_API_KEY
